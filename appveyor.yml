# AppVeyor.com is a Continuous Integration service to build and run tests under
# Windows
# File shamelessly inspired by Astropy

version: 0.5.dev0-{build}

image: Visual Studio 2022

environment:
  global:
    MPLBACKEND: "Agg"

  # Test the oldest and newest supported Python versions
  matrix:
    - PYTHON: "C:\\Python311-x64"
    - PYTHON: "C:\\Python314-x64"

branches:
  only:
    - main
    - 0.1.x
    - 0.2.x
    - 0.3.x
    - 0.4.x

matrix:
  fast_finish: true

install:
  - "set PYTHON_BIN=%PYTHON%\\python.exe"
  - "set PIP_BIN=%PYTHON%\\Scripts\\pip.exe"

  # Check that we have the expected version of Python
  - "%PYTHON_BIN% --version"

  # Install dependencies
  - "choco install pandoc"

  - "%PYTHON_BIN% -m pip install -U pip --quiet"
  - "%PIP_BIN% install numpy --quiet"
  - "%PIP_BIN% install .[dev] --quiet"  # Test installation correctness

build: off

test_script:
  - "%PYTHON_BIN% -m pytest -vv"  # Test against installed code
